services:
  db:
    image: postgres:16-alpine
    container_name: fichaje_demo_db
    environment:
      POSTGRES_PASSWORD: dev_only_not_a_secret
      POSTGRES_DB: fichaje
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fichaje"]
      interval: 2s
      timeout: 3s
      retries: 30
